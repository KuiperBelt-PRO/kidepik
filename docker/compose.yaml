# POC local — FastAPI (Cloud Run) + MinIO (R2)
# Supabase se levanta con `supabase start` (ver scripts/poc-up.ps1)

name: kidepik-poc

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kidepik}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kidepik-local-secret}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}/poc &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kidepik}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kidepik-local-secret}
      S3_BUCKET: ${S3_BUCKET:-kidepik-media}

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://10.0.2.2:8080}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://10.0.2.2:54321}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL:-http://10.0.2.2:9000}
      S3_ENDPOINT_URL: http://minio:9000
      S3_EXTERNAL_ENDPOINT_URL: ${S3_EXTERNAL_ENDPOINT_URL:-http://10.0.2.2:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kidepik}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kidepik-local-secret}
      S3_BUCKET: ${S3_BUCKET:-kidepik-media}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://10.0.2.2:9000/kidepik-media}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  minio-data:
