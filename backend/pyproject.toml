[project]
name = "kidepik-backend"
version = "0.1.0"
description = "KidepiK FastAPI backend (POC Docker)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "python-multipart>=0.0.12",
  "pydantic-ai>=0.7.0",
  "pyyaml>=6.0.2",
  "duckdb>=1.1.0",
  "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not integration and not slow'"
markers = [
  "unit: lógica pura sin I/O de red ni Postgres",
  "contract: HTTP ASGI con dependencias mockeadas",
  "integration: requiere Postgres o Supabase local",
  "slow: tests lentos o con LLM real",
]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/scripts/*",
  "app/__init__.py",
  "app/db/migrations.py",
  "app/db/__init__.py",
  "app/ai/parallel_batch.py",
  "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
