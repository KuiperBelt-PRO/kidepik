# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "kidepik-poc"

[api]
enabled = true
port = 54321
external_url = "env(SUPABASE_API_EXTERNAL_URL)"
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8082"
additional_redirect_urls = [
  "http://localhost:8082",
  "http://localhost:8082/",
  "http://localhost:8082/#/auth/callback",
  "http://127.0.0.1:8082",
  "http://127.0.0.1:8082/",
  "http://127.0.0.1:8082/#/auth/callback",
  "http://192.168.1.75:8082",
  "http://192.168.1.75:8082/",
  "http://192.168.1.75:8082/#/auth/callback",
  "http://10.0.2.2:3000",
  "exp://127.0.0.1:8081",

  "http://192.168.1.75.nip.io:8082",
  "http://192.168.1.75.nip.io:8082/",
  "http://192.168.1.75.nip.io:8082/#/auth/callback",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "env(SUPABASE_GOOGLE_REDIRECT_URI)"
skip_nonce_check = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = true
port = 54324
